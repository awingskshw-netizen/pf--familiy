<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Zona de Juegos Familiar 👨‍👩‍👧‍👧</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f7f9fc;
            color: #333;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 20px;
            overflow: hidden;
        }
        
        /* 상단 날짜 & 날씨 (크기 축소) */
        .header-banner {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            border-radius: 12px;
            padding: 12px 15px;
            color: white;
            text-align: center;
            margin-bottom: 15px;
        }
        .header-banner h1 { font-size: 1rem; margin-bottom: 3px; font-weight: 600; }
        .weather-info { font-size: 0.85rem; opacity: 0.95; }

        /* 섹션 공통 스타일 */
        .section {
            background: #fdfdfd;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .section h2 {
            font-size: 1.05rem;
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        /* 사진 2장 나란히 배치 레이아웃 */
        .photos-grid {
            display: flex;
            gap: 10px;
        }
        .photo-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .photo-card {
            width: 100%;
            height: 130px;
            background: #e1e4e8;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.8rem;
            text-align: center;
            overflow: hidden;
            margin-bottom: 5px;
        }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; }
        .photo-caption { font-size: 0.75rem; text-align: center; color: #555; line-height: 1.2; }

        /* 미니 게임 / 미션 뽑기 버튼 */
        .mission-box {
            text-align: center;
        }
        .mission-btn {
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(79, 172, 254, 0.3);
            transition: 0.2s;
            width: 100%;
        }
        .mission-btn:active { transform: scale(0.98); }
        #mission-result {
            margin-top: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #2c3e50;
            min-height: 25px;
        }

        /* 주사위 게임 스타일 */
        .dice-box {
            text-align: center;
        }
        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
        }
        .dice {
            width: 65px;
            height: 65px;
            background: #fff;
            border: 3px solid #ff6b6b;
            border-radius: 12px;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        .dice.rolling {
            transform: rotate(360deg) scale(1.1);
        }
        .dice-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
            width: 100%;
        }
        .dice-btn:active { transform: scale(0.98); }
        #dice-sum {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 날짜 및 멕시코시티 날씨 -->
        <div class="header-banner">
            <h1 id="current-date">Cargando fecha...</h1>
            <div class="weather-info">🌤️ Ciudad de México · Soleado (24°C)</div>
        </div>

        <!-- 오늘의 추억 사진 2장 (랜덤 출력) -->
        <div class="section">
            <h2>📸 Momentos en Familia</h2>
            <div class="photos-grid" id="photos-container">
                <!-- 자바스크립트로 사진 2장이 여기에 랜덤 로드됩니다 -->
            </div>
        </div>

        <!-- 오늘의 미션 뽑기 게임 -->
        <div class="section mission-box">
            <h2>🎲 Misión Familiar del Día</h2>
            <button class="mission-btn" onclick="pickMission()">¡Sacar una Misión!</button>
            <div id="mission-result">¡Presiona el botón para descubrir la misión!</div>
        </div>

        <!-- 주사위 던지기 게임 -->
        <div class="section dice-box">
            <h2>🎲 ¡Tira los Dados!</h2>
            <div class="dice-container">
                <div class="dice" id="dice1">⚀</div>
                <div class="dice" id="dice2">⚅</div>
            </div>
            <button class="dice-btn" onclick="rollDice()">¡Lanzar Dados!</button>
            <div id="dice-sum">¡Toca el botón para jugar!</div>
        </div>
    </div>

    <script>
        // 1. 오늘 날짜 스페인어 자동 표시
        const dateElement = document.getElementById('current-date');
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        dateElement.innerText = today.toLocaleDateString('es-ES', options);

        // 2. 여러 사진 리스트 (사진 파일명이나 주소를 이곳에 넣어주세요)
        const photoList = [
            { url: "family1.jpg", caption: "¡chamacas! ✨" },
            { url: "family2.jpg", caption: "hermosas 🌲" },
            { url: "family3.jpg", caption: "¡preciosas! 🍕" },
            { url: "family4.jpeg", caption: "❤️" },
            { url: "family5.jpeg", caption: "😊" },
            { url: "family6.jpeg", caption: "tesoros 🎉" },
            { url: "family7.jpeg", caption: "¡lindas! 📸" },
            { url: "family8.jpeg", caption: "¡mis amores! ✨" },
            { url: "family9.jpeg", caption: "¡estrellitas! 🌟" },
            { url: "family10.jpeg", caption: "las amamos mucho 🌳" },
            { url: "family11.jpeg", caption: "bonitas 😍" },
            { url: "family12.jpeg", caption: "🎈" },
            { url: "family13.jpeg", caption: "🥰" },
            { url: "family14.jpeg", caption: "💖" }
        ];

        function loadRandomPhotos() {
            let shuffled = [...photoList].sort(() => 0.5 - Math.random());
            let selectedPhotos = shuffled.slice(0, 2);

            let container = document.getElementById('photos-container');
            container.innerHTML = "";

            selectedPhotos.forEach(photo => {
                let itemDiv = document.createElement('div');
                itemDiv.className = 'photo-item';
                itemDiv.innerHTML = `
                    <div class="photo-card">
                        <img src="${photo.url}" alt="Foto familiar">
                    </div>
                    <p class="photo-caption">"${photo.caption}"</p>
                `;
                container.appendChild(itemDiv);
            });
        }

        loadRandomPhotos();

        // 3. 랜덤 미션 뽑기 기능
        const missions = [
            "🤗 ¡Dale un fuerte abrazo a un miembro de la familia y dile TE AMO!",
            "😜 ¡Tómate una selfie con la cara más graciosa y muéstrala!",
            "📚 ¡Haz 10 veces de sentadilla!",
            "🍫 ¡Juega piedra, papel o tijera para ver quién limpia caca de lilo!",
            "😜 ¡Nadie puede ver a cel ni ipad en la cena",
            "📚 ¡Ver película en familia!",
            "🍫 ¡Reto de comer alguna verdura!"
        ];

        function pickMission() {
            const randomIndex = Math.floor(Math.random() * missions.length);
            const resultBox = document.getElementById('mission-result');
            resultBox.style.color = "#ff6b6b";
            resultBox.innerText = missions[randomIndex];
        }

        // 4. 주사위 굴리기 게임 기능
        const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

        function rollDice() {
            const d1 = document.getElementById('dice1');
            const d2 = document.getElementById('dice2');
            const sumText = document.getElementById('dice-sum');

            // 굴러가는 애니메이션 효과 부여
            d1.classList.add('rolling');
            d2.classList.add('rolling');
            sumText.innerText = "🎲 Rodando los dados...";

            setTimeout(() => {
                d1.classList.remove('rolling');
                d2.classList.remove('rolling');

                const rand1 = Math.floor(Math.random() * 6);
                const rand2 = Math.floor(Math.random() * 6);

                d1.innerText = diceFaces[rand1];
                d2.innerText = diceFaces[rand2];

                const total = rand1 + rand2 + 2;
                sumText.innerText = `✨ ¡Resultado total: ${total} puntos! ✨`;
            }, 300); // 0.3초 동안 구르는 효과
        }
    </script>

</body>
</html>
