<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Zona de Juegos Familiar 👨‍👩‍👧‍👧</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f7f9fc;
            color: #333;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 20px;
            overflow: hidden;
        }
        
        /* 상단 날짜 & 날씨 (크기 축소) */
        .header-banner {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            border-radius: 12px;
            padding: 12px 15px;
            color: white;
            text-align: center;
            margin-bottom: 15px;
        }
        .header-banner h1 { font-size: 1rem; margin-bottom: 3px; font-weight: 600; }
        .weather-info { font-size: 0.85rem; opacity: 0.95; }

        /* 섹션 공통 스타일 */
        .section {
            background: #fdfdfd;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .section h2 {
            font-size: 1.05rem;
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        /* 사진 2장 나란히 배치 레이아웃 */
        .photos-grid {
            display: flex;
            gap: 10px;
        }
        .photo-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .photo-card {
            width: 100%;
            height: 130px;
            background: #e1e4e8;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.8rem;
            text-align: center;
            overflow: hidden;
            margin-bottom: 5px;
        }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; }
        .photo-caption { font-size: 0.75rem; text-align: center; color: #555; line-height: 1.2; }

        /* 미니 게임 / 미션 뽑기 버튼 */
        .mission-box {
            text-align: center;
        }
        .mission-btn {
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(79, 172, 254, 0.3);
            transition: 0.2s;
            width: 100%;
        }
        .mission-btn:active { transform: scale(0.98); }
        #mission-result {
            margin-top: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #2c3e50;
            min-height: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 날짜 및 멕시코시티 날씨 (작게 수정) -->
        <div class="header-banner">
            <h1 id="current-date">Cargando fecha...</h1>
            <div class="weather-info">🌤️ Ciudad de México · Soleado (24°C)</div>
        </div>

        <!-- 오늘의 추억 사진 2장 (랜덤 출력) -->
        <div class="section">
            <h2>📸 Momentos en Familia</h2>
            <div class="photos-grid" id="photos-container">
                <!-- 자바스크립트로 사진 2장이 여기에 랜덤 로드됩니다 -->
            </div>
        </div>

        <!-- 오늘의 미션 뽑기 게임 -->
        <div class="section mission-box">
            <h2>🎲 Misión Familiar del Día</h2>
            <button class="mission-btn" onclick="pickMission()">¡Sacar una Misión!</button>
            <div id="mission-result">¡Presiona el botón para descubrir la misión!</div>
        </div>
    </div>

    <script>
        // 1. 오늘 날짜 스페인어 자동 표시
        const dateElement = document.getElementById('current-date');
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        dateElement.innerText = today.toLocaleDateString('es-ES', options);

        // 2. 여러 사진 리스트 (여기에 사진 주소와 설명을 마음껏 추가할 수 있습니다!)
        const photoList = [
            { url: "https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&w=500&q=80", caption: "¡Divertido día en el parque! ✨" },
            { url: "https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?auto=format&fit=crop&w=500&q=80", caption: "Paseo familiar inolvidable 🌲" },
            { url: "https://images.unsplash.com/photo-1543353071-10c8ba85a904?auto=format&fit=crop&w=500&q=80", caption: "¡Disfrutando una rica comida juntos! 🍕" },
            { url: "https://images.unsplash.com/photo-1516627145497-ae6968895b74?auto=format&fit=crop&w=500&q=80", caption: "Jugando y riendo en casa 🧸" },
            { url: "https://images.unsplash.com/photo-1472152049653-e31a8c98c199?auto=format&fit=crop&w=500&q=80", caption: "Atardecer hermoso en familia 🌅" }
        ];

        // 접속할 때마다 랜덤으로 2장을 골라 화면에 띄우는 함수
        function loadRandomPhotos() {
            // 배열을 섞어서 앞의 2개 선택
            let shuffled = [...photoList].sort(() => 0.5 - Math.random());
            let selectedPhotos = shuffled.slice(0, 2);

            let container = document.getElementById('photos-container');
            container.innerHTML = "";

            selectedPhotos.forEach(photo => {
                let itemDiv = document.createElement('div');
                itemDiv.className = 'photo-item';
                itemDiv.innerHTML = `
                    <div class="photo-card">
                        <img src="${photo.url}" alt="Foto familiar">
                    </div>
                    <p class="photo-caption">"${photo.caption}"</p>
                `;
                container.appendChild(itemDiv);
            });
        }

        // 페이지가 열릴 때 실행
        loadRandomPhotos();

        // 3. 랜덤 미션 뽑기 기능 (스페인어)
        const missions = [
            "🤗 ¡Dale un fuerte abrazo a un miembro de la familia y dile algo lindo!",
            "😜 ¡Tómate una selfie con la cara más graciosa y muéstrala!",
            "📚 ¡Cuéntale a todos una historia divertida en 3 oraciones!",
            "🎤 ¡Canta tu canción favorita con mucha energía durante 10 segundos!",
            "🍫 ¡Juega piedra, papel o tijera para ver quién elige el postre!"
        ];

        function pickMission() {
            const randomIndex = Math.floor(Math.random() * missions.length);
            const resultBox = document.getElementById('mission-result');
            resultBox.style.color = "#ff6b6b";
            resultBox.innerText = missions[randomIndex];
        }
    </script>

</body>
</html>
